<!DOCTYPE html>

<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administración de usuarios</title>
    <link rel="stylesheet" href="../style/style-usuarios.css">
    <link rel="icon" href="../assets/icons/HospitalDeClinicas.ico">


</head>

<body>

    <header class="header">
        <div class="logo-container">
            <img src="../assets/img/HospitalDeClinicas.png" alt="Logo Hospital de Clínicas" class="logo">
        </div>

        <div class="titulo">
            <h1>Administración de usuarios</h1>
        </div>
    </header>
<div class="layout">
    <aside class="sidebar">
        <ul class="menu">
            <a href="../html/TransportedeVehiculos.html">
                <li class="menu-item">
                    Gestión de ambulancias
                </li>
            </a>
            <a href="../html/PanelAdministrativo.html">
                <li class="menu-item">
                    Panel administrativo
                </li>
            </a>
        </ul>
    </aside>


    <main class="main-container">
        <section class="panel">

            <div class="panel-header">
                <div>
                    <h2>Usuarios Registrados</h2>
                </div>

                <button id="btnNuevo" class="btn">+ Nuevo usuario</button>
            </div>

            <div class="usuario-actual">
                <div class="usuario-datos">

                    <div class="user-info">
                        <span class="user">
                            Usuario:
                            <span id="nombreUsuario">---</span>
                        </span>

                        <span class="user-admin">
                            Rol:
                            <span id="rolUsuario">---</span>
                        </span>
                    </div>
                </div>

                <button id="btnLogout" class="btn-logout">Cerrar sesión</button>
            </div>

            <div class="tabla-container">
                <table>
                    <thead>
                        <tr>
                            <th>CI</th>
                            <th>Nombre</th>
                            <th>Apellido</th>
                            <th>Cargo</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>

                    <tbody id="tablaUsuarios"></tbody>
                </table>
            </div>

        </section>
    </main>

    <div id="modalNuevo" class="modal">
        <div class="modal-contenido">

            <div class="modal-header">
                <div>
                    <h2>Nuevo usuario</h2>
                    <p>Complete los datos del nuevo usuario</p>
                </div>

                <button type="button" id="btnCerrarModal" class="btn-cerrar">&times;</button>
            </div>

            <form id="formNuevoUsuario">

                <div class="campo">
                    <label for="ci">CI</label>
                    <input type="text" id="ci" name="ci" maxlength="10" required>
                </div>

                <div class="campo">
                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre" name="nombre" maxlength="30" required>
                </div>

                <div class="campo">
                    <label for="apellido">Apellido</label>
                    <input type="text" id="apellido" name="apellido" maxlength="30" required>
                </div>

                <div class="campo">
                    <label for="pass">Contraseña</label>
                    <input type="password" id="pass" name="pass" maxlength="30" required>
                </div>

                <div class="campo">
                    <label for="cargo">Cargo</label>
                    <select id="cargo" name="cargo" required>
                        <option value="">Seleccione un Cargo</option>
                        <option value="Enfermero">Enfermero</option>
                        <option value="Administrativo">Administrativo</option>
                    </select>
                </div>

                <p id="mensajeNuevo"></p>

                <div class="modal-acciones">
                    <button type="button" id="btnCancelar" class="btn-secundario">Cancelar</button>
                    <button type="submit" class="btn">Crear usuario</button>
                </div>

            </form>

        </div>
    </div>

</div>
</body>
<script src="../js/usuarios-main.js"></script>

</html>
