<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Encuesta</title>
    <link rel="stylesheet" href="../style/style-encuesta.css">
    <link rel="icon" href="../assets/icons/HospitalDeClinicas.ico">
</head>

<body>
    <header class="header">
        <div class="logo-container">
            <img src="../assets/img/HospitalDeClinicas.png" alt="Logo" class="logo">
        </div>
        <div class="titulo">
            <h1>Encuestas</h1>
        </div>
    </header>

    <div class="layout">
        <aside class="sidebar">
            <ul class="menu">
                <a href="../html/DocumentacionParaPacientes.html" class="menu-link">
                    <li class="menu-item">
                        <img src="../assets/img/file-text.svg" alt="Icono Documento" class="menu-icon">
                        <span class="menu-text">Gestión de documentos</span>
                    </li>
                </a>
                <a href="../html/Encuesta.html" class="menu-link">
                    <li class="menu-item">
                        <img src="../assets/img/circle-dashed-check.svg" alt="Icono encuesta" class="menu-icon">
                        <span class="menu-text">Encuestas</span>
                    </li>
                </a>
            </ul>
            <a href="../index.html"><button class="volver">Volver</button></a>
        </aside>

        <main class="main-container">
            <section class="panel">
                <div class="preferencias-encabezado">
                    <div id="filtros" class="filtros">
                        <button class="btn-filtro" data-categoria="1" type="button">Atencion</button>
                        <button class="btn-filtro" data-categoria="2" type="button">Limpieza</button>
                        <button class="btn-filtro" data-categoria="3" type="button">Instalaciones</button>
                        <button class="btn-filtro" data-categoria="4" type="button">Personal</button>
                        <button class="btn-filtro" data-categoria="5" type="button">Servicios</button>
                    </div>

                    <h2 id="tituloEncuesta">Gestión de Encuestas</h2>
                    <p id="descripcionEncuesta">Seleccione una categoría para evaluar el servicio recibido.</p>
                </div>

                <form id="formEncuesta">
                    <div id="contenedorPreguntas"></div>

                    <div class="acciones-preferencias" style="display: none;" id="contenedorBotonEnviar">
                        <button type="submit" id="btnGuardarEncuesta">Enviar Encuesta</button>
                    </div>
                    <p id="mensajeEncuesta" class="mensaje-preferencias" role="status" aria-live="polite"></p>
                </form>
            </section>
        </main>
    </div>

    <footer class="footer">
        <p>© 2026 TriAxis Technologies. Todos los derechos reservados.</p>
    </footer>
</body>
<script src="../js/encuesta.js"></script>

</html>
